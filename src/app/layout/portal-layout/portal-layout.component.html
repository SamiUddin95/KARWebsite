<div class="portal-layout" [class.sidebar-collapsed]="!sidebarOpen()">

  <!-- Sidebar -->
  <aside class="portal-sidebar">
    <div class="sidebar-header">
      <a routerLink="/" class="sidebar-logo">
        <img src="assets/images/logo-white.png" alt="KAR" class="sidebar-logo-img" />
        <img src="assets/images/logo-sm.png" alt="KAR" class="sidebar-logo-sm" style="display:none;height:28px;width:auto;object-fit:contain" />
      </a>
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-user">
      <div class="avatar avatar-md avatar-gold sidebar-avatar">
        <span>{{ (auth.currentUser()?.fullName ?? 'U')[0] }}</span>
      </div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">{{ auth.currentUser()?.fullName }}</div>
        <div class="sidebar-user-role">{{ auth.userRole() }}</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="sidebar-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            @if (item.icon === 'grid')      { <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/> }
            @if (item.icon === 'briefcase') { <path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/> }
            @if (item.icon === 'calendar')  { <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/> }
            @if (item.icon === 'file')      { <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/> }
            @if (item.icon === 'user')      { <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/> }
            @if (item.icon === 'book')      { <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/> }
            @if (item.icon === 'heart')     { <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/> }
          </svg>
          <span class="sidebar-nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/" class="sidebar-nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span class="sidebar-nav-label">Public Site</span>
      </a>
      <button class="sidebar-nav-item logout-btn" (click)="auth.logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="sidebar-nav-label">Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="portal-main">
    <header class="portal-topbar">
      <button class="topbar-menu-btn" (click)="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title">{{ portalTitle }}</span>
      <div class="topbar-actions">
        <span class="topbar-user">{{ auth.currentUser()?.fullName }}</span>
      </div>
    </header>

    <main class="portal-content">
      <router-outlet />
    </main>
  </div>
</div>
