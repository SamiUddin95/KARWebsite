<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A client consulting a lawyer by video call">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4266"/>
      <stop offset=".55" stop-color="#072f4c"/>
      <stop offset="1" stop-color="#031a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".36" r=".6">
      <stop offset="0" stop-color="#c6a15b" stop-opacity=".3"/>
      <stop offset="1" stop-color="#c6a15b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12567f"/>
      <stop offset="1" stop-color="#082b43"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd49c"/>
      <stop offset="1" stop-color="#b98f4e"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c88f"/>
      <stop offset="1" stop-color="#a97f45"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1536" fill="url(#bg)"/>
  <rect width="1024" height="1536" fill="url(#glow)"/>

  <!-- decorative rings -->
  <g fill="none" stroke="#c6a15b">
    <circle cx="512" cy="600" r="470" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="512" cy="600" r="360" stroke-opacity=".1" stroke-width="1.5"/>
    <circle cx="512" cy="600" r="255" stroke-opacity=".13"/>
  </g>
  <g fill="#c6a15b" opacity=".14">
    <circle cx="140" cy="240" r="5"/>
    <circle cx="880" cy="330" r="4"/>
    <circle cx="200" cy="1120" r="4"/>
    <circle cx="860" cy="1180" r="6"/>
    <circle cx="512" cy="130" r="4"/>
  </g>

  <!-- tablet -->
  <g>
    <rect x="252" y="330" width="520" height="700" rx="34" fill="#041d35" stroke="url(#gold)" stroke-width="5"/>
    <rect x="276" y="354" width="472" height="600" rx="14" fill="url(#screen)"/>
    <circle cx="512" cy="992" r="14" fill="none" stroke="#c6a15b" stroke-opacity=".6" stroke-width="3"/>

    <!-- video call: lawyer figure -->
    <circle cx="512" cy="560" r="92" fill="url(#figure)"/>
    <path d="M512 668 c-118 0 -196 74 -196 176 l0 60 392 0 0 -60 c0 -102 -78 -176 -196 -176z" fill="url(#figure)"/>
    <!-- collar + tie -->
    <path d="M512 668 l-34 46 34 78 34 -78z" fill="#082b43"/>
    <path d="M512 700 l-13 22 13 92 13 -92z" fill="#041d35"/>
    <path d="M478 668 l34 46 -46 26z M546 668 l-34 46 46 26z" fill="#f2e3c2" opacity=".85"/>

    <!-- call UI -->
    <rect x="300" y="378" width="150" height="26" rx="13" fill="#ffffff" opacity=".14"/>
    <circle cx="322" cy="391" r="7" fill="#e8cf9a"/>
    <rect x="338" y="385" width="96" height="12" rx="6" fill="#ffffff" opacity=".35"/>

    <g>
      <circle cx="430" cy="906" r="26" fill="#ffffff" opacity=".18"/>
      <circle cx="512" cy="906" r="26" fill="#ffffff" opacity=".18"/>
      <circle cx="594" cy="906" r="26" fill="#d9534f"/>
      <path d="M582 906 a12 12 0 0 1 24 0 l-6 0 a6 6 0 0 0 -12 0z" fill="#fff"/>
      <rect x="420" y="898" width="20" height="14" rx="3" fill="#fff" opacity=".9"/>
      <path d="M503 898 l18 8 -18 8z" fill="#fff" opacity=".9"/>
    </g>
  </g>

  <!-- floating chat bubble -->
  <g>
    <rect x="96" y="640" width="180" height="96" rx="18" fill="#0a3a5c" stroke="#c6a15b" stroke-opacity=".5" stroke-width="2"/>
    <path d="M150 736 l-8 30 34 -30z" fill="#0a3a5c" stroke="#c6a15b" stroke-opacity=".5" stroke-width="2"/>
    <rect x="122" y="668" width="128" height="10" rx="5" fill="#c6a15b" opacity=".7"/>
    <rect x="122" y="690" width="88" height="10" rx="5" fill="#c6a15b" opacity=".4"/>
  </g>

  <!-- verified badge -->
  <g>
    <circle cx="812" cy="700" r="52" fill="#0a3a5c" stroke="url(#gold)" stroke-width="3"/>
    <path d="M788 700 l16 16 34 -36" fill="none" stroke="#e8cf9a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- scales of justice mark -->
  <g stroke="#c6a15b" stroke-width="6" fill="none" opacity=".8" transform="translate(512 1180)">
    <line x1="0" y1="-70" x2="0" y2="60"/>
    <line x1="-90" y1="-40" x2="90" y2="-40"/>
    <path d="M-90 -40 l-34 66 a40 22 0 0 0 68 0z"/>
    <path d="M90 -40 l-34 66 a40 22 0 0 0 68 0z"/>
    <line x1="-40" y1="60" x2="40" y2="60"/>
    <circle cx="0" cy="-78" r="10" fill="#c6a15b" stroke="none"/>
  </g>

  <!-- bottom vignette -->
  <rect x="0" y="1236" width="1024" height="300" fill="#021220" opacity=".55"/>
</svg>
