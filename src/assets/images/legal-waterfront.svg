<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid slice" role="img" aria-label="An illuminated waterfront promenade and city skyline at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#021627"/>
      <stop offset=".42" stop-color="#0a3a58"/>
      <stop offset=".62" stop-color="#1d6a8c"/>
      <stop offset=".72" stop-color="#c98f4e"/>
      <stop offset=".78" stop-color="#e9c07a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f4d9a0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#e9bd6d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#e9bd6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d5b"/>
      <stop offset=".25" stop-color="#062a42"/>
      <stop offset="1" stop-color="#02121f"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2c44"/>
      <stop offset="1" stop-color="#041a2b"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1180" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e8f1f7">
    <circle cx="120" cy="120" r="2.4" opacity=".8"/>
    <circle cx="300" cy="80" r="1.6" opacity=".6"/>
    <circle cx="520" cy="150" r="2" opacity=".7"/>
    <circle cx="720" cy="90" r="1.5" opacity=".55"/>
    <circle cx="900" cy="180" r="2.2" opacity=".75"/>
    <circle cx="200" cy="300" r="1.4" opacity=".5"/>
    <circle cx="640" cy="260" r="1.8" opacity=".6"/>
    <circle cx="840" cy="360" r="1.3" opacity=".45"/>
    <circle cx="420" cy="330" r="1.5" opacity=".5"/>
    <circle cx="80" cy="440" r="1.6" opacity=".5"/>
  </g>

  <!-- setting sun glow -->
  <circle cx="512" cy="1150" r="560" fill="url(#sun)"/>

  <!-- distant skyline -->
  <g fill="#0a2f47" opacity=".85">
    <rect x="0" y="880" width="90" height="300"/>
    <rect x="96" y="830" width="60" height="350"/>
    <rect x="164" y="900" width="80" height="280"/>
    <rect x="252" y="800" width="56" height="380"/>
    <rect x="316" y="860" width="90" height="320"/>
    <rect x="640" y="840" width="70" height="340"/>
    <rect x="718" y="790" width="54" height="390"/>
    <rect x="780" y="870" width="86" height="310"/>
    <rect x="874" y="820" width="60" height="360"/>
    <rect x="942" y="890" width="82" height="290"/>
  </g>

  <!-- near skyline -->
  <g fill="url(#bldg)">
    <rect x="30" y="960" width="110" height="220"/>
    <rect x="150" y="900" width="80" height="280"/>
    <rect x="240" y="980" width="120" height="200"/>
    <rect x="370" y="860" width="90" height="320"/>
    <rect x="470" y="940" width="110" height="240"/>
    <rect x="590" y="890" width="86" height="290"/>
    <rect x="686" y="960" width="120" height="220"/>
    <rect x="816" y="910" width="80" height="270"/>
    <rect x="906" y="980" width="118" height="200"/>
  </g>
  <!-- towers -->
  <g fill="#041a2b">
    <rect x="392" y="800" width="46" height="60"/>
    <rect x="500" y="880" width="50" height="60"/>
    <rect x="612" y="830" width="44" height="60"/>
    <line x1="415" y1="800" x2="415" y2="740" stroke="#041a2b" stroke-width="6"/>
    <line x1="634" y1="830" x2="634" y2="770" stroke="#041a2b" stroke-width="6"/>
    <circle cx="415" cy="736" r="6" fill="#e9c07a"/>
    <circle cx="634" cy="766" r="6" fill="#e9c07a"/>
  </g>

  <!-- lit windows -->
  <g fill="#f0cd8a">
    <rect x="52" y="990" width="10" height="14" opacity=".9"/><rect x="80" y="990" width="10" height="14" opacity=".5"/><rect x="108" y="1020" width="10" height="14" opacity=".8"/><rect x="52" y="1060" width="10" height="14" opacity=".6"/><rect x="108" y="1090" width="10" height="14" opacity=".9"/>
    <rect x="168" y="930" width="9" height="12" opacity=".8"/><rect x="196" y="960" width="9" height="12" opacity=".55"/><rect x="168" y="1010" width="9" height="12" opacity=".85"/><rect x="196" y="1050" width="9" height="12" opacity=".6"/><rect x="168" y="1100" width="9" height="12" opacity=".75"/>
    <rect x="262" y="1000" width="10" height="13" opacity=".7"/><rect x="296" y="1000" width="10" height="13" opacity=".9"/><rect x="330" y="1030" width="10" height="13" opacity=".5"/><rect x="262" y="1080" width="10" height="13" opacity=".85"/><rect x="330" y="1110" width="10" height="13" opacity=".65"/>
    <rect x="392" y="890" width="9" height="12" opacity=".9"/><rect x="420" y="920" width="9" height="12" opacity=".6"/><rect x="392" y="970" width="9" height="12" opacity=".75"/><rect x="420" y="1020" width="9" height="12" opacity=".9"/><rect x="392" y="1080" width="9" height="12" opacity=".55"/>
    <rect x="492" y="970" width="10" height="13" opacity=".8"/><rect x="528" y="1000" width="10" height="13" opacity=".6"/><rect x="556" y="1030" width="10" height="13" opacity=".85"/><rect x="492" y="1080" width="10" height="13" opacity=".7"/><rect x="528" y="1120" width="10" height="13" opacity=".9"/>
    <rect x="612" y="920" width="9" height="12" opacity=".85"/><rect x="644" y="950" width="9" height="12" opacity=".6"/><rect x="612" y="1000" width="9" height="12" opacity=".75"/><rect x="644" y="1060" width="9" height="12" opacity=".9"/><rect x="612" y="1110" width="9" height="12" opacity=".55"/>
    <rect x="708" y="990" width="10" height="13" opacity=".7"/><rect x="744" y="1020" width="10" height="13" opacity=".9"/><rect x="780" y="1050" width="10" height="13" opacity=".55"/><rect x="708" y="1100" width="10" height="13" opacity=".8"/>
    <rect x="838" y="940" width="9" height="12" opacity=".85"/><rect x="866" y="980" width="9" height="12" opacity=".6"/><rect x="838" y="1040" width="9" height="12" opacity=".75"/><rect x="866" y="1100" width="9" height="12" opacity=".9"/>
    <rect x="928" y="1010" width="10" height="13" opacity=".7"/><rect x="964" y="1040" width="10" height="13" opacity=".85"/><rect x="996" y="1090" width="10" height="13" opacity=".6"/>
  </g>

  <!-- water -->
  <rect x="0" y="1180" width="1024" height="356" fill="url(#water)"/>

  <!-- reflections -->
  <g fill="#e9c07a">
    <rect x="500" y="1180" width="24" height="200" opacity=".28"/>
    <rect x="480" y="1190" width="64" height="10" opacity=".35"/>
    <rect x="470" y="1230" width="84" height="8" opacity=".25"/>
    <rect x="486" y="1280" width="52" height="7" opacity=".3"/>
    <rect x="496" y="1340" width="32" height="6" opacity=".22"/>
    <rect x="60" y="1180" width="14" height="120" opacity=".18"/>
    <rect x="170" y="1180" width="12" height="140" opacity=".2"/>
    <rect x="300" y="1180" width="16" height="110" opacity=".16"/>
    <rect x="400" y="1180" width="12" height="150" opacity=".2"/>
    <rect x="620" y="1180" width="14" height="130" opacity=".18"/>
    <rect x="750" y="1180" width="12" height="100" opacity=".16"/>
    <rect x="850" y="1180" width="14" height="140" opacity=".2"/>
    <rect x="960" y="1180" width="12" height="110" opacity=".16"/>
  </g>
  <g stroke="#9cc4d8" stroke-opacity=".18" stroke-width="3">
    <line x1="40" y1="1260" x2="240" y2="1260"/>
    <line x1="660" y1="1300" x2="920" y2="1300"/>
    <line x1="120" y1="1380" x2="420" y2="1380"/>
    <line x1="560" y1="1420" x2="860" y2="1420"/>
  </g>

  <!-- promenade railing -->
  <g stroke="#02121f" stroke-width="10">
    <line x1="0" y1="1470" x2="1024" y2="1470"/>
  </g>
  <g stroke="#02121f" stroke-width="7">
    <line x1="60" y1="1470" x2="60" y2="1536"/><line x1="160" y1="1470" x2="160" y2="1536"/><line x1="260" y1="1470" x2="260" y2="1536"/><line x1="360" y1="1470" x2="360" y2="1536"/><line x1="460" y1="1470" x2="460" y2="1536"/><line x1="560" y1="1470" x2="560" y2="1536"/><line x1="660" y1="1470" x2="660" y2="1536"/><line x1="760" y1="1470" x2="760" y2="1536"/><line x1="860" y1="1470" x2="860" y2="1536"/><line x1="960" y1="1470" x2="960" y2="1536"/>
  </g>
  <!-- promenade lamps -->
  <g>
    <line x1="180" y1="1470" x2="180" y2="1330" stroke="#02121f" stroke-width="9"/>
    <circle cx="180" cy="1318" r="16" fill="#f0cd8a"/>
    <circle cx="180" cy="1318" r="30" fill="#f0cd8a" opacity=".25"/>
    <line x1="844" y1="1470" x2="844" y2="1330" stroke="#02121f" stroke-width="9"/>
    <circle cx="844" cy="1318" r="16" fill="#f0cd8a"/>
    <circle cx="844" cy="1318" r="30" fill="#f0cd8a" opacity=".25"/>
  </g>
</svg>
